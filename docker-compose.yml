version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: apex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       apex_mev
      POSTGRES_USER:     apex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_mev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apex-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: apex-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL:        postgres://apex:${POSTGRES_PASSWORD:-changeme}@postgres:5432/apex_mev
      DATABASE_MAX_CONNECTIONS: 20
      REDIS_URL:           redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      JWT_SECRET:          ${JWT_SECRET:?JWT_SECRET required}
      ADMIN_EMAIL:         ${ADMIN_EMAIL:-admin@apex.local}
      ADMIN_USERNAME:      ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:      ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      API_HOST:            0.0.0.0
      API_PORT:            8080
      HELIUS_API_KEY:      ${HELIUS_API_KEY:-}
      ALCHEMY_API_KEY:     ${ALCHEMY_API_KEY:-}
      JUPITER_API_KEY:     ${JUPITER_API_KEY:-}
      APEX_HTTP_RPC_URL:   ${APEX_HTTP_RPC_URL:-https://api.mainnet-beta.solana.com}
      APEX_RPC_URL:        ${APEX_RPC_URL:-wss://api.mainnet-beta.solana.com}
      APEX_SIMULATION_ONLY: ${APEX_SIMULATION_ONLY:-true}
      JITO_TIP_ACCOUNT:    ${JITO_TIP_ACCOUNT:-96gYZGLnJYVFmbjzopPSU6QiEV5fGqZNyN9nmNhvrZU5}
      JITO_TIP_LAMPORTS:   ${JITO_TIP_LAMPORTS:-1000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      RUST_LOG:            info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: apex-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: apex-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: apex-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     false
      GF_SERVER_HTTP_PORT:        3001
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
